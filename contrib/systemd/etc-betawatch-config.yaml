# Which objects to add to the database, uses the osmium-tags-filter syntax.
select:
  - "climbing"
  - "climbing:*"
  - "sport=*climbing"
  - "sport=*boulder"
  - "path=climbing_access"
  - "leisure=climbing"

# Address to serve the live web view on (e.g., ":8080").
# Read by betawatch-feed; empty to disable the web view.
http_addr: ":8080"

# Path to the shared SQLite database. betawatch-ingest writes it,
# betawatch-feed reads it.
db_path: "/var/lib/betawatch/betawatch.db"

# File recording the last processed minute, read by betawatch-ingest.
ingest_state_path: "/var/lib/betawatch/ingest-state.json"

# How far back to catch up on first run (e.g., "2h", "6h", "24h").
# Read by betawatch-ingest.
backfill_duration: "168h"

# Descriptive labels for a selected object. These never affect selection,
# and an object can carry several.
classify:
  route:
    - "climbing=route,route_bottom,route_top"
  crag:
    - "climbing=crag"
  area:
    - "climbing=area"
  gym:
    - "leisure=sports_centre,sports_hall,pitch"
    - "tower:type=climbing"
    - "indoor=yes"
  natural:
    - "natural=cliff,rock,stone,bare_rock"
  topo:
    - "wikimedia_commons:path*"
  boulder:
    - "climbing=boulder"
    - "climbing:boulder!=no"
  sport:
    - "climbing:sport!=no"
  trad:
    - "climbing:trad!=no"
  mixed:
    - "climbing:mixed!=no"
  ice:
    - "climbing:ice!=no"
  dry:
    - "climbing:dry!=no"
  aid:
    - "climbing:aid!=no"
  building:
    - "building"
  path:
    - "path=climbing_access"
    - "highway=path"

unwanted_tags:
  - "climbing!=route,route_bottom,route_top,boulder,crag,area,anchor"
  - "climbing:adventure"
  - "climbing:area"
  - "climbing:bottomrope"
  - "climbing:boulder_stones"
  - "climbing:boulder_wall"
  - "climbing:bouldering"
  - "climbing:boulders"
  - "climbing:chains"
  - "climbing:descent"
  - "climbing:feature=summit_log"
  - "climbing:fee"
  - "climbing:grade:fb"
  - "climbing:grade:fontainebleau"
  - "climbing:indoor"
  - "climbing:length=0"
  - "climbing:lower_off"
  - "climbing:mountainproject"
  - "climbing:name"
  - "climbing:outdoor=yes"
  - "climbing:restriction=null"
  - "climbing:route"
  - "climbing:route_bottom"
  - "climbing:route_top"
  - "climbing:safety_rope"
  - "climbing:sector"
  - "climbing:stone"
  - "climbing:style=sport"
  - "climbing:top_level"
  - "climbing:topo"
  - "climbing:traditional"
  - "climbing:unknown"
  - "climbing:url"
  - "climbing:via_ferrata"
  - "climbing:wall:type"
  - "climbing:wall_height"
  - "climbing:wall_routes"
  - "climbing_crag"
  - "climbing_style"
  - "climbing_type"
  - "climbing_wall"
  - "leisure=climbing"
  - "name:climbing"
  - "rock"
  - "site=climbing_area"
  - "site_climbing"
  - "sport=*boulder"
  - "sport=*ice_climbing"
  - "sport=*rock_climbing"

tag_values_regex:
  - author: '^[^;]+(?:\s*;\s*(?:\d{1,2}\.\d{1,2}\.\d{4}|\d{1,2}\.\d{4}|\d{4}))?$'
  - climbing: '^(route|route_bottom|route_top|boulder|crag|area|anchor)$'
  - climbing:aid: '^(yes|[1-9][0-9]*)$'
  - climbing:beginner_friendly: '^yes$'
  - climbing:bolted: '^(yes|[1-9][0-9]*)$'
  - climbing:bolts: '^[1-9][0-9]*$'
  - climbing:boulder: '^(yes|[1-9][0-9]*)$'
  - climbing:chipped: '^yes$'
  - climbing:deepwater: '^(yes|[1-9][0-9]*)$'
  - climbing:dry: '^(yes|[1-9][0-9]*)$'
  - climbing:family_friendly: '^yes$'
  - climbing:grade:aid: '^A[0-5]$'
  - climbing:grade:dry: '^D(?:1[0-9]|[1-9])[+-]?(?:\/D(?:1[0-9]|[1-9])[+-]?)?$'
  - climbing:grade:ewbank: '^(?:[1-4][0-9]|[1-9])(?:\/(?:[1-4][0-9]|[1-9]))?$'
  - climbing:grade:fb: '^(?:[6-9][A-C]\+?|[1-5]\+?)(?:\/(?:[6-9][A-C]\+?|[1-5]\+?))?$'
  - climbing:grade:font: '^(?:[6-9][A-C]\+?|[1-5]\+?)(?:\/(?:[6-9][A-C]\+?|[1-5]\+?))?$'
  - climbing:grade:french: '^(?:[1-3]|[4-9][a-c]\+?)(?:\/(?:[1-3]|[4-9][a-c]\+?))?$'
  - climbing:grade:hueco: '^(?:VB[|-]?|V0[+-]?|V[1-9]\d?)(?:\/(?:VB[|-]?|V0[+-]?|V[1-9]\d?))?$'
  - climbing:grade:ice: '^WI[1-7][+-]?(?:\/WI[1-7][+-]?)?$'
  - climbing:grade:mixed: '^M(?:1[0-9]|[1-9])[+-]?(?:\/M(?:1[0-9]|[1-9])[+-]?)?$'
  - climbing:grade:uiaa: '^(?:1[0-3]|[1-9])[+-]?(?:\/(?:1[0-3]|[1-9])[+-]?)?$'
  - climbing:grade:yds_class: '^(?:[34]|5\.(?:1[0-5][a-d]?[+-]?|[0-9][+-]?))(?:\/(?:1[0-5][a-d]?|[/a-d]))?$'
  - climbing:guidebook*: '^(?:ISBN(?:-10)?:?\s*)?(?:[0-9]{1,5}[-\s]?[0-9]+[-\s]?[0-9]+[-\s]?[0-9X])$|^(?:ISBN(?:-13)?:?\s*)?(?:97[89][-\s]?[0-9]{1,5}[-\s]?[0-9]+[-\s]?[0-9]+[-\s]?[0-9])$'
  - climbing:hazard:*: '^yes$'
  - climbing:ice: '^(yes|[1-9][0-9]*)$'
  - climbing:inclination:*: '^yes$'
  - climbing:kids: '^yes$'
  - climbing:length: '^[1-9][0-9]*(?:\.[0-9]{1,2})?\s?[m]?$'
  - climbing:mixed: '^(yes|[1-9][0-9]*)$'
  - climbing:multipitch: '^(yes|[1-9][0-9]*)$'
  - climbing:orientation: '^[SENW;]+$'
  - climbing:pitches: '^[1-9][0-9]*$'
  - climbing:quality: '^(solid|fragile|medium)$'
  - climbing:routes: '^[1-9][0-9]*$'
  - climbing:speed: '^(yes|[1-9][0-9]*)$'
  - climbing:sport: '^(yes|[1-9][0-9]*)$'
  - climbing:summit_log: '^yes$'
  - climbing:toprope: '^(yes|[1-9][0-9]*)$'
  - climbing:trad: '^(yes|[1-9][0-9]*)$'
  - climbing:url:*: '^https?:\/\/(?:www\.)?[-a-zA-Z0-9@:%._\+~#=]{1,256}\.[a-zA-Z0-9()]{1,63}\b(?:[-a-zA-Z0-9()@:%_\+.~#?&\/=]*)$'
  - covered: '^yes$'
  - ele: '^[1-9][0-9]*(?:\.[0-9]{1,2})?\s?[m]?$'
  - height: '^[1-9][0-9]*(?:\.[0-9]{1,2})?\s?[m]?$'
  - sport: '^climbing'
  - url: '^https?:\/\/(?:www\.)?[-a-zA-Z0-9@:%._\+~#=]{1,256}\.[a-zA-Z0-9()]{1,63}\b(?:[-a-zA-Z0-9()@:%_\+.~#?&\/=]*)$'
  - website: '^https?:\/\/(?:www\.)?[-a-zA-Z0-9@:%._\+~#=]{1,256}\.[a-zA-Z0-9()]{1,63}\b(?:[-a-zA-Z0-9()@:%_\+.~#?&\/=]*)$'

# Named SQL queries for the problems page (/problems.html), each selecting
# the (id, type) of live elements with a problem. They run against the
# "elements" table of the SQLite schema (see internal/store/schema.sql),
# read-only, and never affect selection or the main feed.
rules:
  - name: "missing name"
    disabled: true
    description: "All climbing objects should have a name tag."
    query: >
      SELECT e.id, e.type
      FROM elements AS e
      WHERE e.tags ->> '$.climbing' IN (
          'route',
          'route-bottom',
          'crag',
          'area',
          'boulder'
      )
        AND (
            e.tags ->> '$.name' IS NULL
            OR trim(e.tags ->> '$.name') = ''
        )
      ORDER BY e.id, e.type
  - name: "climbing style invalid value"
    description: "Climbing style tags e.g. climbing:boulder, climbing:sport, climbing:trad, etc. should have a value of 'yes', 'no', or a positive integer."
    query: >
      SELECT DISTINCT e.id, e.type
      FROM elements AS e, json_each(e.tags) AS tag
      WHERE tag.key IN (
          'climbing:boulder', 'climbing:sport', 'climbing:speed',
          'climbing:toprope', 'climbing:trad', 'climbing:multipitch',
          'climbing:ice', 'climbing:mixed', 'climbing:dry',
          'climbing:aid', 'climbing:deepwater'
      )
      AND lower(trim(tag.value)) NOT IN ('yes', 'no', 'limited')
      AND NOT (
          json_valid(tag.value)
          AND json_type(tag.value) IN ('integer', 'real')
      )
      ORDER BY e.id, e.type
  - name: "climbing:pitches not a positive integer"
    description: "The climbing:pitches tag should be a positive integer."
    query: >
      SELECT DISTINCT e.id, e.type
      FROM elements AS e,
           json_each(e.tags) AS tag
      WHERE tag.key = 'climbing:pitches'
        AND NOT (
            CAST(tag.value AS TEXT) <> ''
            AND CAST(tag.value AS TEXT) NOT GLOB '*[^0-9]*'
            AND CAST(tag.value AS INTEGER) > 0
        )
      ORDER BY e.id, e.type
  - name: "climbing:start invalid value"
    description: "The climbing:start tag should have a value of 'stand', 'sit', or 'jump'."
    query: >
      SELECT DISTINCT e.id, e.type
      FROM elements AS e,
           json_each(e.tags) AS tag
      WHERE tag.key = 'climbing:start'
        AND lower(trim(CAST(tag.value AS TEXT))) NOT IN ('stand', 'sit', 'jump')
      ORDER BY e.id, e.type
  - name: "Route with multiple climbing style"
    disabled: true
    description: "A climbing route should not have multiple climbing style tags set to 'yes'."
    query: >
      SELECT e.id, e.type
      FROM elements AS e
      JOIN json_each(e.tags) AS tag
      WHERE e.tags ->> '$.climbing' IN ('route', 'route-bottom')
        AND tag.key IN (
            'climbing:boulder',
            'climbing:sport',
            'climbing:speed',
            'climbing:toprope',
            'climbing:trad',
            'climbing:ice',
            'climbing:mixed',
            'climbing:dry',
            'climbing:aid',
            'climbing:deepwater'
        )
        AND lower(trim(CAST(tag.value AS TEXT))) = 'yes'
      GROUP BY e.id, e.type
      HAVING COUNT(*) > 1
      ORDER BY e.id, e.type
  - name: "Route with invalid climbing style value"
    description: "A climbing route should only have climbing style tags with a value of 'yes'"
    query: >
      SELECT DISTINCT e.id, e.type
      FROM elements AS e
      JOIN json_each(e.tags) AS tag
      WHERE e.tags ->> '$.climbing' IN ('route', 'route-bottom')
        AND tag.key IN (
            'climbing:boulder',
            'climbing:sport',
            'climbing:speed',
            'climbing:toprope',
            'climbing:trad',
            'climbing:ice',
            'climbing:mixed',
            'climbing:dry',
            'climbing:aid',
            'climbing:deepwater',
            'climbing:multipitch'
        )
        AND lower(trim(CAST(tag.value AS TEXT))) NOT IN ('yes', 'no')
      ORDER BY e.id, e.type;
  - name: "Invalid value for yes/no tag"
    description: "Some climbing tags are yes/no tags and should only have a value of 'yes' or 'no'."
    query: >
      SELECT DISTINCT e.id, e.type
      FROM elements AS e
      JOIN json_each(e.tags) AS tag
      WHERE tag.key IN (
          'climbing:beginner_friendly',
          'climbing:chipped',
          'climbing:family_friendly',
          'climbing:hazard:animal_nest',
          'climbing:hazard:bad_protection',
          'climbing:hazard:death_fall_zone',
          'climbing:hazard:dirty_rock',
          'climbing:hazard:highball',
          'climbing:hazard:loose_rock',
          'climbing:hazard:missing_anchor',
          'climbing:hazard:rockfall_zone',
          'climbing:hazard:slippery_rock',
          'climbing:hazard:unstable_anchor',
          'climbing:hazard:vegetation',
          'climbing:hazard:wet',
          'climbing:inclination:overhang',
          'climbing:inclination:roof',
          'climbing:inclination:slab',
          'climbing:inclination:traverse',
          'climbing:inclination:vertical',
          'climbing:summit_log'
      )
        AND lower(trim(CAST(tag.value AS TEXT))) NOT IN ('yes', 'no')
      ORDER BY e.id, e.type
  - name: "Invalid Wikimedia Commons path"
    description: "The wikimedia_commons:path tag should start with '0.' don't link images or categories from Wikimedia Commons."
    query: >
      SELECT DISTINCT e.id, e.type
      FROM elements AS e
      JOIN json_each(e.tags) AS tag
      WHERE tag.key = 'wikimedia_commons:path'
        AND trim(CAST(tag.value AS TEXT)) NOT GLOB '0.*'
      ORDER BY e.id, e.type
  - name: "Invalid Aid Grade"
    description: "The climbing:grade:aid tag should be a valid aid grade."
    query: >
      SELECT DISTINCT e.id, e.type
      FROM elements AS e
      JOIN json_each(e.tags) AS tag
      WHERE tag.key LIKE 'climbing:grade:aid%'
      AND CAST(tag.value AS TEXT) NOT REGEXP '^A[0-5]$'
      ORDER BY e.id, e.type;
  - name: "Invalid Dry Tooling Grade"
    description: "The climbing:grade:dry tag should be a valid dry tooling grade."
    query: >
      SELECT DISTINCT e.id, e.type
      FROM elements AS e
      JOIN json_each(e.tags) AS tag
      WHERE tag.key LIKE 'climbing:grade:dry%'
      AND CAST(tag.value AS TEXT) NOT REGEXP
      '^D(?:1[0-9]|[1-9])[+-]?(?:\/D(?:1[0-9]|[1-9])[+-]?)?$'
      ORDER BY e.id, e.type;
  - name: "Invalid Ewbank Grade"
    description: "The climbing:grade:ewbank tag should be a valid Ewbank grade."
    query: >
      SELECT DISTINCT e.id, e.type
      FROM elements AS e
      JOIN json_each(e.tags) AS tag
      WHERE tag.key LIKE 'climbing:grade:ewbank%'
      AND CAST(tag.value AS TEXT) NOT REGEXP
      '^(?:[1-4][0-9]|[1-9])(?:\/(?:[1-4][0-9]|[1-9]))?$'
      ORDER BY e.id, e.type;
  - name: "Invalid Fontainebleau Grade"
    description: "The climbing:grade:fb tag should be a valid Fontainebleau grade."
    query: >
      SELECT DISTINCT e.id, e.type
      FROM elements AS e
      JOIN json_each(e.tags) AS tag
      WHERE tag.key LIKE 'climbing:grade:fb%'
      AND CAST(tag.value AS TEXT) NOT REGEXP
      '^(?:[1-9][A-C]\+?|[1-5]\+?)(?:\/(?:[1-9][A-C]\+?|[1-5]\+?))?$'
      ORDER BY e.id, e.type;
  - name: "Invalid Font Grade"
    description: "The climbing:grade:font tag should be a valid Font grade."
    query: >
      SELECT DISTINCT e.id, e.type
      FROM elements AS e
      JOIN json_each(e.tags) AS tag
      WHERE tag.key LIKE 'climbing:grade:font%'
      AND CAST(tag.value AS TEXT) NOT REGEXP
      '^(?:[1-9][A-C]\+?|[1-5]\+?)(?:\/(?:[1-9][A-C]\+?|[1-5]\+?))?$'
      ORDER BY e.id, e.type;
  - name: "Invalid French Grade"
    # Way to many errors because mixed with font grades. Where 5+ is also allowed.
    disabled: true
    description: "The climbing:grade:french tag should be a valid French grade."
    query: >
      SELECT DISTINCT e.id, e.type
      FROM elements AS e
      JOIN json_each(e.tags) AS tag
      WHERE tag.key LIKE 'climbing:grade:french%'
      AND CAST(tag.value AS TEXT) NOT REGEXP
      '^(?:[1-9][a-c]\+?|[1-3]\+?)(?:\/(?:[1-9][a-c]\+?|[1-3]\+?))?$'
      ORDER BY e.id, e.type;
  - name: "Invalid Hueco Grade"
    description: "The climbing:grade:hueco tag should be a valid Hueco grade."
    query: >
      SELECT DISTINCT e.id, e.type
      FROM elements AS e
      JOIN json_each(e.tags) AS tag
      WHERE tag.key LIKE 'climbing:grade:hueco%'
      AND CAST(tag.value AS TEXT) NOT REGEXP
      '^(?:VB[|-]?|V0[+-]?|V[1-9]\d?\+?)(?:\/(?:VB[|-]?|V0[+-]?|V[1-9]\d?))?$'
      ORDER BY e.id, e.type;
  - name: "Invalid Ice Grade"
    description: "The climbing:grade:ice tag should be a valid ice grade."
    query: >
      SELECT DISTINCT e.id, e.type
      FROM elements AS e
      JOIN json_each(e.tags) AS tag
      WHERE tag.key LIKE 'climbing:grade:ice%'
      AND CAST(tag.value AS TEXT) NOT REGEXP
      '^WI[1-7][+-]?(?:\/WI[1-7][+-]?)?$'
      ORDER BY e.id, e.type;
  - name: "Invalid Mixed Grade"
    description: "The climbing:grade:mixed tag should be a valid mixed grade."
    query: >
      SELECT DISTINCT e.id, e.type
      FROM elements AS e
      JOIN json_each(e.tags) AS tag
      WHERE tag.key LIKE 'climbing:grade:mixed%'
      AND CAST(tag.value AS TEXT) NOT REGEXP
      '^M(?:1[0-9]|[1-9])[+-]?(?:\/M(?:1[0-9]|[1-9])[+-]?)?$'
      ORDER BY e.id, e.type;
  - name: "Invalid UIAA Grade"
    disabled: true
    description: "The climbing:grade:uiaa tag should be a valid UIAA grade."
    query: >
      SELECT DISTINCT e.id, e.type
      FROM elements AS e
      JOIN json_each(e.tags) AS tag
      WHERE tag.key LIKE 'climbing:grade:uiaa%'
      AND CAST(tag.value AS TEXT) NOT REGEXP
      '^(?:1[0-3]|[1-9])[+-]?(?:\/(?:1[0-3]|[1-9])[+-]?)?$'
      ORDER BY e.id, e.type;
  - name: "Invalid YDS Class Grade"
    description: "The climbing:grade:yds_class tag should be a valid YDS class grade."
    query: >
      SELECT DISTINCT e.id, e.type
      FROM elements AS e
      JOIN json_each(e.tags) AS tag
      WHERE tag.key LIKE 'climbing:grade:yds_class%'
      AND CAST(tag.value AS TEXT) NOT REGEXP
      '^(?:[34]|5\.(?:1[0-5][a-d]?[+-]?|[0-9][+-]?))(?:\/(?:1[0-5][a-d]?|[/a-d]))?$'
      ORDER BY e.id, e.type;
  - name: "Invalid length"
    description: "The climbing:length tag should be a positive number with optional unit 'm'."
    query: >
      SELECT DISTINCT e.id, e.type
      FROM elements AS e
      JOIN json_each(e.tags) AS tag
      WHERE tag.key LIKE 'climbing:length%'
        AND CAST(tag.value AS TEXT) NOT REGEXP
        "^\d+(?:\.\d+)?(?:\s*[m'])?$"
      ORDER BY e.id, e.type;
  - name: "Invalid bolted value"
    description: "The climbing:bolted tag should be 'yes' or a positive number."
    query: >
      SELECT DISTINCT e.id, e.type
      FROM elements AS e
      JOIN json_each(e.tags) AS tag
      WHERE tag.key = 'climbing:bolted'
        AND CAST(tag.value AS TEXT) NOT REGEXP
        "^(?:\d+(?:\.\d+)?(?:\s*[m'])?|yes|no|mixed)$"
      ORDER BY e.id, e.type;
  - name: "Invalid quality value"
    description: "The climbing:quality tag should be 'solid', 'fragile', or 'medium'."
    query: >
      SELECT DISTINCT e.id, e.type
      FROM elements AS e
      JOIN json_each(e.tags) AS tag
      WHERE tag.key = 'climbing:quality'
        AND CAST(tag.value AS TEXT) NOT REGEXP
        '^(solid|fragile|medium|mixed)$'
      ORDER BY e.id, e.type;
  - name: "Invalid orientation value"
    disabled: true
    description: "The climbing:orientation tag should be a combination of N, S, E, W, separated by semicolons."
    query: >
      SELECT DISTINCT e.id, e.type
      FROM elements AS e
      JOIN json_each(e.tags) AS tag
      WHERE tag.key = 'climbing:orientation'
        AND CAST(tag.value AS TEXT) NOT REGEXP
        '^[NEWS]{1,3}(?:;[NEWS]{1,3})*$'
      ORDER BY e.id, e.type;
