# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: 'go.mod'
        check-latest: true
        cache-dependency-path: 'go.sum'

    - name: Install dependencies
      run: go mod download

    - name: Build Ingest
      run: CGO_ENABLED=0 GOAMD64=v3 GOARM64="v8.2,lse,crypto" go build -o betawatch-ingest ./cmd/ingest/

    - name: Build Feed
      run: CGO_ENABLED=0 GOAMD64=v3 GOARM64="v8.2,lse,crypto" go build -o betawatch-feed ./cmd/feed/

    - name: Vet
      run: go vet ./...

    - name: Test
      run: GOAMD64=v3 GOARM64="v8.2,lse,crypto" go test -race -v ./...
