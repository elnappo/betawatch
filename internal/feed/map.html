<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, nocache">
    <title>BetaWatch — Map</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <style>
        :root {
            --bg: #fff;
            --fg: #1a1a1a;
            --muted: #666;
            --line: #e2e2e2;
            --accent: #0a7d3f;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #16181c;
                --fg: #e8e8e8;
                --muted: #9a9a9a;
                --line: #2c2f36;
                --accent: #4ade80;
            }
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        /* The map takes whatever the header and footer leave, so the page
           itself never scrolls. */
        body {
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--fg);
        }

        header {
            display: flex;
            align-items: baseline;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 18px;
            margin: 0;
        }

        #status {
            color: var(--muted);
            font-size: 13px;
        }

        #status::before {
            content: "● ";
        }

        #status.live::before {
            color: var(--accent);
            animation: pulse 4s ease-in-out infinite;
        }

        #status.down::before {
            color: #d14;
        }

        @keyframes pulse {
            50% {
                opacity: .25;
            }
        }

        #count {
            color: var(--muted);
            font-size: 13px;
            margin-left: auto;
        }

        a.site {
            color: var(--muted);
            font-size: 13px;
        }

        .mapwrap {
            position: relative;
            flex: 1;
            min-height: 240px;
            border: 1px solid var(--line);
            border-radius: 4px;
            overflow: hidden;
        }

        #map {
            position: absolute;
            inset: 0;
            background: var(--line);
        }

        #hint {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            padding: 4px 12px;
            border-radius: 12px;
            background: var(--bg);
            color: var(--muted);
            font-size: 13px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, .3);
            pointer-events: none;
        }

        .dot {
            position: relative;
            display: block;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--accent);
            border: 2px solid #fff;
            box-shadow: 0 0 3px rgba(0, 0, 0, .5);
        }

        /* A ring spreads out from a new marker once, so a change that just
           arrived is easy to find on a world map. */
        .dot.new::after {
            content: "";
            position: absolute;
            inset: -2px;
            border-radius: 50%;
            border: 2px solid var(--accent);
            animation: ring 1.8s ease-out;
            pointer-events: none;
        }

        @keyframes ring {
            from {
                transform: scale(1);
                opacity: 1;
            }
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .dot.new::after {
                animation: none;
                display: none;
            }
        }

        .popup {
            font: 13px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
        }

        .popup .title {
            font-weight: 600;
            font-size: 14px;
        }

        .popup .meta {
            color: #666;
        }

        .popup .create {
            color: #0a7d3f;
        }

        .popup .modify {
            color: #b7791f;
        }

        footer {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 20px;
            align-items: center;
            margin-top: 12px;
            color: var(--muted);
            font-size: 12.5px;
        }

        footer a {
            color: inherit;
        }

        footer a:hover {
            color: var(--fg);
        }

        footer svg {
            vertical-align: -2px;
            margin-right: 5px;
        }
    </style>
</head>
<body>
<header>
    <h1>BetaWatch — Map</h1>
    <span id="status">connecting…</span>
    <span id="count"></span>
    <a class="site" href="./">live feed</a>
    <a class="site" href="problems.html">problems</a>
    <a class="site" href="stats.html">stats</a>
    <a class="site" href="https://openclimbing.org/" target="_blank" rel="noopener">openclimbing.org</a>
</header>

<div class="mapwrap">
    <div id="map"></div>
    <div id="hint">Waiting for the next change…</div>
</div>

<footer>
    <a href="https://github.com/elnappo/betawatch/" target="_blank" rel="noopener">
        <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" fill="currentColor">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38
        0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01
        1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95
        0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2
        .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87
        3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/>
        </svg>
        github.com/elnappo/betawatch
    </a>
    <span>
    Data from <a href="https://www.openstreetmap.org/" target="_blank" rel="noopener">OpenStreetMap</a>
    contributors, available under the
    <a href="https://opendatacommons.org/licenses/odbl/" target="_blank" rel="noopener">ODbL</a>.
  </span>
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
    const statusEl = document.getElementById('status');
    const countEl = document.getElementById('count');
    const hintEl = document.getElementById('hint');

    // How many markers the map holds before dropping the oldest.
    const maxMarkers = 500;

    const markers = [];
    let unlocated = 0;

    const map = L.map('map', {worldCopyJump: true}).setView([25, 10], 2);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    }).addTo(map);

    const ago = d => {
        const secs = Math.round((Date.now() - d) / 1000);
        if (secs < 10) return 'just now';
        if (secs < 60) return secs + 's ago';
        const mins = Math.round(secs / 60);
        if (mins < 60) return mins + ' min ago';
        const hours = Math.round(mins / 60);
        if (hours < 24) return hours + (hours === 1 ? ' hour ago' : ' hours ago');
        const days = Math.round(hours / 24);
        return days + (days === 1 ? ' day ago' : ' days ago');
    };

    const link = (parent, href, text) => {
        const a = document.createElement('a');
        a.href = href;
        a.target = '_blank';
        a.rel = 'noopener';
        a.textContent = text;
        parent.append(a);
        return a;
    };

    // popupFor builds the popup from DOM nodes and textContent: names and
    // usernames are typed by anyone with an OSM account.
    function popupFor(c) {
        const box = document.createElement('div');
        box.className = 'popup';

        const title = document.createElement('div');
        title.className = 'title';
        title.textContent = c.name || '(unnamed)';
        box.append(title);

        const what = document.createElement('div');
        const action = document.createElement('span');
        action.className = c.action;
        action.textContent = c.action;
        what.append(action, ' ' + c.type + (c.version ? ' v' + c.version : ''));
        box.append(what);

        if (c.classes && c.classes.length) {
            const cls = document.createElement('div');
            cls.className = 'meta';
            cls.textContent = c.classes.join(', ');
            box.append(cls);
        }

        const who = document.createElement('div');
        who.className = 'meta';
        if (c.user) {
            who.append('by ');
            // A username can hold spaces and other characters that need escaping.
            link(who, 'https://www.openstreetmap.org/user/' + encodeURIComponent(c.user), c.user);
        } else {
            who.append('by (anonymous)');
        }
        who.append(', ' + ago(new Date(c.timestamp)));
        box.append(who);

        const links = document.createElement('div');
        link(links, c.url, c.type + '/' + c.id);
        links.append(' · ');
        link(links, c.changeset_url, 'cs');
        links.append(' · ');
        link(links, 'https://openclimbing.org/' + c.type + '/' + c.id, 'oc');
        box.append(links);

        return box;
    }

    function updateCount() {
        let text = markers.length + (markers.length === 1 ? ' change' : ' changes');
        if (unlocated) text += ' · ' + unlocated + ' not shown (ways, relations, deletes)';
        countEl.textContent = text;
    }

    function addChange(c) {
        // Only nodes carry coordinates; ways, relations and deletes have none.
        if (c.lat == null || c.lon == null) {
            unlocated++;
            updateCount();
            return;
        }

        const icon = L.divIcon({
            className: '',
            html: '<span class="dot new"></span>',
            iconSize: [14, 14],
            iconAnchor: [7, 7],
            popupAnchor: [0, -9],
        });
        const marker = L.marker([c.lat, c.lon], {icon}).addTo(map);
        marker.bindPopup(() => popupFor(c));
        markers.push(marker);

        hintEl.hidden = true;

        // Keep the page bounded on a long-running session.
        while (markers.length > maxMarkers) markers.shift().remove();
        updateCount();
    }

    function connect() {
        const es = new EventSource('events');

        es.onopen = () => {
            statusEl.textContent = 'live';
            statusEl.className = 'live';
        };

        es.onmessage = e => {
            try {
                addChange(JSON.parse(e.data));
            } catch (err) {
                console.error('bad event', err, e.data);
            }
        };

        es.onerror = () => {
            statusEl.textContent = 'reconnecting…';
            statusEl.className = 'down';
            // EventSource retries on its own; nothing to do here.
        };
    }

    connect();
</script>
</body>
</html>
